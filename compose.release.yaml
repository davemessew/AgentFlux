# Load the image from the GitHub release before starting this file.
services:
  agentflux:
    image: agentflux:0.2.0
    pull_policy: never
    init: true
    ports:
      - "127.0.0.1:4310:4310"
    volumes:
      - agentflux-data:/app/data
      # Optional import folder, after creating ./imports:
      # - ./imports:/imports:ro
    environment:
      AGENTFLUX_IMPORT_ROOTS: "${AGENTFLUX_IMPORT_ROOTS:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  agentflux-data:
