services:
  agentflux:
    image: agentflux:local
    build: .
    init: true
    ports:
      - "127.0.0.1:4310:4310"
    volumes:
      - agentflux-data:/app/data
      # Optional extra import folder (create ./imports first):
      # - ./imports:/imports:ro
    environment:
      # Container paths; separate multiple roots with a semicolon.
      AGENTFLUX_IMPORT_ROOTS: "${AGENTFLUX_IMPORT_ROOTS:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  agentflux-data:
